# Example configuration for the ISCE2 -> dolphin -> MintPy pipeline.
# Run with:  python -m isce_dolphin_mintpy run config/example.yaml
# Every option not given here uses the default shown.

paths:
  slc_dir: /path/to/SLC              # folder with S1*_SLC__*.SAFE (or .zip)
  orbit_dir: /path/to/orbits         # precise/restituted orbit files (.EOF)
  dem_file: /path/to/dem.tif         # any GDAL-readable lat/lon DEM covering the processed bursts
  dem_vertical_datum: egm2008        # REQUIRED: egm2008 (Copernicus DEM), egm96 (SRTM) or ellipsoid
                                     # the pipeline converts to WGS84 ellipsoid heights for ISCE2
  work_dir: /path/to/output          # all results go here (isce/, crop/, dolphin/, mintpy/, logs/)
  aux_dir: null                      # S1 aux calibration files; default: <work_dir>/isce/aux

aoi:
  bbox: [48.17, 48.23, 16.34, 16.38] # [south, north, west, east] in degrees
  file: null                         # vector file (gpkg/geojson/shp); its bbox replaces 'bbox'
  buffer_m: 500                      # margin around the AOI for burst selection and crop

water_mask:                          # optional; converted to dolphin's output grid as water fraction
  file: null                         # geocoded lat/lon raster, e.g. watermask.tif
  water_value: 0                     # mask value meaning water (other values = land, nodata ignored)
  max_water_fraction: 0.8            # pixel is masked only if MORE than 80% of it is water
  use_in_dolphin: true               # pass the mask to dolphin (applied in unwrapping)

isce:                                # stackSentinel.py options (SLC workflow, no multilooking)
  reference_date: null               # YYYYMMDD; default: first date
  swaths: null                       # e.g. [1, 2]; default: swaths whose real burst footprints cover the AOI
  polarization: vv
  coregistration: NESD               # NESD = geometry + ESD; geometry = geometry only
  esd_coherence_threshold: 0.85
  num_overlap_connections: 3         # ESD pairs per date
  num_proc: 4                        # parallel commands per run file
  num_proc4topo: 2
  omp_threads: 2
  topsstack_dir: null                # folder with stackSentinel.py; default: auto-detect

# Who turns the interferograms into a time series. Affects the dolphin AND the MintPy step:
#   mintpy  = MintPy network inversion of dolphin's interferograms (with unwrapping error correction)
#   dolphin = dolphin's own time series inversion; MintPy only applies the corrections
# Switching it requires rerunning dolphin (--steps dolphin mintpy).
inversion: mintpy

dolphin:
  # dolphin's own config structure (same names and nesting as dolphin's YAML). Every
  # option is listed with its description and the pipeline default in
  # config/dolphin_options_reference.yaml; options not given here keep that default.
  # The pipeline sets the input SLCs, work directory, water mask and wavelength itself.
  # All options are checked with dolphin's own model when the config is loaded.
  output_options:
    strides: {x: 4, y: 1}            # output pixel = 4 range x 1 azimuth pixels, about 15 m x 14 m
  phase_linking:
    ministack_size: 15
    half_window: {x: 11, y: 5}       # phase-linking window half size (range, azimuth)
    shp_method: glrt                 # statistically homogeneous pixel test
  interferogram_network:
    max_bandwidth: 3                 # each date with its 3 nearest neighbours
  unwrap_options:
    unwrap_method: whirlwind         # snaphu / whirlwind / spurt / icu / phass
    n_parallel_jobs: -1              # -1: dolphin chooses (whirlwind: CPUs // 4 at once)
    whirlwind_options:
      num_threads: null              # null: all CPUs (shared by the parallel unwraps)
      conncomp_reliability: 0.5      # higher = more conservative connected components
    snaphu_options:                  # only used with unwrap_method: snaphu
      ntiles: [1, 1]
  worker_settings:
    threads_per_worker: 4
    block_shape: [512, 512]

mintpy:
  # --- pipeline options ---
  dolphin_temporal_coherence_threshold: 0.6   # extra mask from phase-linking quality; null = off

  # --- MintPy options ---
  # Every key starting with "mintpy." is an original smallbaselineApp.cfg option. It is written
  # unchanged to <work_dir>/mintpy/isce_dolphin_mintpy.cfg, like a custom MintPy template.
  # Options not listed keep MintPy's default (auto). All options with explanations:
  #   smallbaselineApp.py -H     or   mintpy/defaults/smallbaselineApp.cfg
  # Quote yes/no ("no"), otherwise YAML reads them as true/false (both work, quoting is clearer).
  # Every smallbaselineApp.cfg option is accepted; misspelled names stop the run. mintpy.load.*,
  # mintpy.subset.* and mintpy.multilook.* only warn: load_data is not run (use aoi.bbox / strides).
  # Ordered like smallbaselineApp.cfg, i.e. by processing step.

  ## computing resources
  mintpy.compute.cluster: local                      # parallel with Dask on this machine
  mintpy.compute.numWorker: all                      # all CPU cores
  mintpy.compute.maxMemory: 16                       # GB
  ## reference_point
  mintpy.reference.lalo: 48.19767391928604, 16.325432508158606   # must lie in the AOI (this point: whole-Vienna AOI)
  ## correct_unwrap_error
  mintpy.unwrapError.method: bridging+phase_closure  # no / bridging / phase_closure / bridging+phase_closure
  ## invert_network
  mintpy.networkInversion.maskDataset: connectComponent   # dolphin conn. component 0 = unreliable unwrapping
  mintpy.networkInversion.minTempCoh: 0.7
  ## correct_troposphere
  mintpy.troposphericDelay.method: pyaps             # pyaps (ERA5, needs ~/.cdsapirc) / height_correlation / gacos / no
  mintpy.troposphericDelay.weatherModel: ERA5
  ## deramp
  mintpy.deramp: quadratic                           # no / linear / quadratic
  ## reference_date
  mintpy.reference.date: "20220101"                  # must be an acquisition date of the stack (checked early)
  ## plot
  mintpy.plot: "yes"                                 # figures of every step in <work_dir>/mintpy/pic/
